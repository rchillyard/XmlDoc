name: IDML merge tests and release evidence
on:
  push:
    branches: [V1_1_3-Kaining-2]
  pull_request:
    branches: [V1_1_3-Kaining-2, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  automated-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@c6bd01274abceb9dd5bd9f1a336c2a26c259de69 # v1
      - name: Scala unit, corpus, acceptance and KML regressions
        run: sbt 'core/test' 'idml/test' 'kml/test'
      - name: Read-only corpus verification
        run: python3 idml/tools/generate_three_way_corpus.py --verify
      - name: Corpus corruption and real-evidence gate tests
        run: python3 -m unittest discover -s idml/tools -p 'test_*.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: idml-test-results
          path: '**/target/test-reports/*.xml'
  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Strict real-world evidence gate (missing records must fail)
        run: python3 idml/tools/verify_real_world_manifest.py --report real-world-readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-world-readiness
          path: real-world-readiness.json
