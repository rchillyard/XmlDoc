---
# Files Codacy should not analyse.
exclude_paths:
  # Test fixtures: sample documents and the three-way merge corpus, with their READMEs.
  - "**/src/test/resources/**"
  # The Python script that generates the three-way merge corpus.
  - "idml/tools/**"
  # The three-way merge paper and the script that builds it. Neither is library code
  # nor part of the build: build_paper.py drives a machine-local Node runtime to render
  # figures, and the rest is prose and figures. Its subprocess use is list-form with a
  # hardcoded script, so the findings here were Bandit's blanket advisories.
  - "idml/docs/paper/**"
