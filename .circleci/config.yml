# Scala CircleCI 2.1 configuration file for XmlDoc
#
# Check https://circleci.com/docs/2.0/sample-config/ for more details
#
version: 2.1
jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0

    working_directory: ~/repo

    environment:
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/plugins.sbt" }}-{{ checksum "project/build.properties" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      # Compile core + kml (the root-aggregated modules)
      - run:
          name: Compile
          command: cat /dev/null | sbt compile

      # Save dependency cache
      - save_cache:
          paths:
            - ~/.sbt
            - ~/.ivy2/cache
            - ~/.cache/coursier
          key: v1-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/plugins.sbt" }}-{{ checksum "project/build.properties" }}

      # Unit tests (core + kml)
      - run:
          name: Test
          command: cat /dev/null | sbt test

      # Integration tests (kml-it is deliberately not aggregated by root, so it's run explicitly)
      - run:
          name: Integration test
          command: cat /dev/null | sbt kmlIt/test

      # Generate scaladoc (catches doc warnings in CI)
      - run:
          name: Doc
          command: cat /dev/null | sbt doc

workflows:
  build-and-test:
    jobs:
      - build
